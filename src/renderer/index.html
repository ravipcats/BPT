<!DOCTYPE html>
<html>
  <head>
    <title>Numbers Table</title>
  </head>
  <body>
    <h1>Numbers 1 to 100 (Horizontal)</h1>
    <table id="numbers-table" border="1">
      <thead>
        <tr>
          <th colspan="100">Numbers</th>
        </tr>
      </thead>
      <tbody>
        <tr id="numbers-row">
          <!-- Numbers will be inserted here -->
        </tr>
      </tbody>
    </table>
    <script>
      const row = document.getElementById('numbers-row');
      for (let i = 1; i <= 100; i++) {
        const td = document.createElement('td');
        td.textContent = i;
        row.appendChild(td);
      }
    </script>
  </body>
</html>
