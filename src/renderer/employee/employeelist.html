<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Employee List</title>
  <link rel="stylesheet" href="../styles/employee.css">
</head>
<body>
  <h1>Employee List</h1>

  <!-- Add Employee Form -->
  <form id="add-employee-form">
    <input id="emp-name" placeholder="Name" required>
    <input id="emp-role" placeholder="Role" required>
    <button type="submit">Add Employee</button>
  </form>

  <ul id="employee-list"></ul>
  <ul id="shift-list" class="list-group mb-4"></ul>

  <button id="employee-list-btn" class="btn btn-primary">Employee List</button>
  <button id="table-report-btn" class="btn btn-secondary ms-2">Table Report</button>

  <script>
    function loadEmployees() {
      window.api.getEmployees()
        .then(employees => {
          const list = document.getElementById('employee-list');
          list.innerHTML = '';
          employees.forEach(emp => {
            const li = document.createElement('li');
            li.textContent = `${emp.name} (${emp.role})`;
            list.appendChild(li);
          });
        })
        .catch(err => {
          let customMsg = 'Could not load employees.';
          if (err.message && err.message.includes('no such table')) {
            customMsg = 'Employee table does not exist. Please contact your administrator.';
          }
          alert(customMsg);
        });
    }

    // Handle Add Employee Form
    document.getElementById('add-employee-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('emp-name').value;
      const role = document.getElementById('emp-role').value;
      window.api.addEmployee({ name, role }).then(() => {
        loadEmployees();
        e.target.reset();
      }).catch(err => {
        alert('Failed to add employee: ' + (err.message || err));
      });
    });

    document.getElementById('table-report-btn').onclick = () => {
      window.location = 'employeeReport.html';
    };

    loadEmployees();
  </script>
</body>
</html>
