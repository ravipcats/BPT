<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="../../node_modules/bootstrap/dist/css/bootstrap.min.css">
  <meta charset="UTF-8">
  <title>Employee Table Report</title>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="card shadow">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h2 class="mb-0">Employee Table Report</h2>
        <button class="btn btn-light btn-sm" onclick="window.location='employeelist.html'">
          <span class="bi bi-arrow-left"></span> Back
        </button>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-bordered table-striped align-middle" id="employees-table">
            <thead class="table-light">
              <tr>
                <th scope="col">#</th>
                <th scope="col">Name</th>
                <th scope="col">Role</th>
              </tr>
            </thead>
            <tbody>
              <!-- Rows will be inserted here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.api.getEmployees().then(employees => {
      const tbody = document.querySelector('#employees-table tbody');
      tbody.innerHTML = '';
      if (!employees || employees.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td colspan="3" class="text-center text-muted">No employee data available.</td>`;
        tbody.appendChild(tr);
        return;
      }
      employees.forEach((emp, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<th scope="row">${idx + 1}</th><td>${emp.name}</td><td>${emp.role}</td>`;
        tbody.appendChild(tr);
      });
    }).catch(err => {
      alert('Error loading employees: ' + (err.message || err));
    });
  </script>
</body>
</html>
